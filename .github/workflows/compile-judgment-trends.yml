name: Compile annual judgment trends

on:
  push:
    paths:
      - ".github/workflows/compile-judgment-trends.yml"
      - "scripts/compile_judgment_trends.py"
      - "scripts/audit_judgment_year_coverage.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile-annual-judgment-trends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out judgment data sparsely
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            .github
            scripts
            data/judgments/summaries
            data/judgments/parquet
          sparse-checkout-cone-mode: true

      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.5.0

      - name: Compile aggregate trends
        run: python scripts/compile_judgment_trends.py

      - name: Audit focal-year parsing coverage
        run: python scripts/audit_judgment_year_coverage.py

      - name: Commit aggregate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data/dataverse/judgment-trends
          if git diff --cached --quiet; then
            echo "Aggregate outputs are unchanged."
            exit 0
          fi
          git commit -m "Compile annual judgment trends [skip ci]"
          git push
